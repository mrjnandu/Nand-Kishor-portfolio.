g.add(new THREE.Points(gg,new THREE.PointsMaterial({color:cA,size:.07,transparent:true,opacity:.9})));
var lv=[];for(i=0;i<n;i++)for(j=i+1;j<n;j++)if(pts[i].distanceTo(pts[j])<.62)lv.push(pts[i].x,pts[i].y,pts[i].z,pts[j].x,pts[j].y,pts[j].z);
var lg=new THREE.BufferGeometry();lg.setAttribute("position",new THREE.Float32BufferAttribute(lv,3));
g.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:cA,transparent:true,opacity:.16})));
var rings=[],sats=[];
[[4.3,.5,0],[4.9,-.7,.6]].forEach(function(c,k){var m=new THREE.Mesh(new THREE.TorusGeometry(c[0],.012,8,160),new THREE.MeshBasicMaterial({color:cB,transparent:true,opacity:.5}));m.rotation.x=1.2+c[1];m.rotation.y=c[2];g.add(m);rings.push(m);
var d=new THREE.Mesh(new THREE.SphereGeometry(.13,12,12),new THREE.MeshBasicMaterial({color:cB}));m.add(d);sats.push({d:d,r:c[0],a:k*3,v:.008+k*.004})});
var sv=[];for(i=0;i<450;i++)sv.push((Math.random()-.5)*70,(Math.random()-.5)*45,(Math.random()-.5)*50);
var sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.Float32BufferAttribute(sv,3));
var stars=new THREE.Points(sg,new THREE.PointsMaterial({color:cA,size:.05,transparent:true,opacity:.55}));s.add(stars);
var W=1000;function size(){var w=innerWidth,h=innerHeight;W=w;r.setSize(w,h,false);cam.aspect=w/h;cam.position.z=w<700?15:12;cam.updateProjectionMatrix()}
addEventListener("resize",size);size();
var mx=0,my=0,sp=0;
addEventListener("pointermove",function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function draw(t){
var mh=document.documentElement.scrollHeight-innerHeight;sp=mh>0?scrollY/mh:0;
if(!still){sats.forEach(function(o){o.a+=o.v;o.d.position.set(Math.cos(o.a)*o.r,Math.sin(o.a)*o.r,0)});
rings[0].rotation.z=t*.0002;stars.rotation.y=t*.00002;requestAnimationFrame(draw)}
g.rotation.y+=((t*.00015+sp*Math.PI*2+mx*.7)-g.rotation.y)*.06;
g.rotation.x+=((my*.4+.25)-g.rotation.x)*.06;
var tx=W>900?3.4-sp*6.8:0;g.position.x+=(tx-g.position.x)*.06;
g.position.y=-sp*1.5;
r.render(s,cam)}
draw(0);
})();
</script></body></html>
